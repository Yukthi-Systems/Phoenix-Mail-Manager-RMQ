[relay_servers]
; Put the Relay Server details here. The format is as follows:
; <Server-ID> ansible_host=<IP_ADDRESS> ansible_user=<USERNAME> ansible_password=<PASSWORD> ansible_become_password=<BECOME_PASSWORD> ansible_port=<PORT_NUMBER>
; Server-ID : The server ID of the relay server that you can find from the Admin Panel.

[cloud_servers]
; Put the Cloud Server details here (means MailBox Server, where the mails are stored/dovecot). The format is as follows:
; <Server-ID> ansible_host=<IP_ADDRESS> ansible_user=<USERNAME> ansible_password=<PASSWORD> ansible_become_password=<BECOME_PASSWORD> ansible_port=<PORT_NUMBER>
; Server-ID : The server ID of the cloud server that you can find from the Admin Panel.

[imapsync_server]
; Put the IMAP Sync Server details here. This is where the imapsync tool should be installed and good CPU and RAM should be available. The format is as follows:
; imapsyncXX ansible_host=<IP_ADDRESS> ansible_user=<USERNAME> ansible_password=<PASSWORD> ansible_become_password=<BECOME_PASSWORD> ansible_port=<PORT_NUMBER>
; XX : The number of the imapsync server. Start with 01 and increment for each additional imapsync server.
